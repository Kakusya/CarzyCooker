syntax = "proto3";
package ET;

// ResponseType SupplyRequestResponse
message SupplyRequestRequest // IRequest
{
    int32 RpcId = 1;
    int32 ProtocolVersion = 2;
    string MatchId = 3;
    string WorldId = 4;
    int64 WorldGeneration = 5;
    int64 LevelId = 6;
    int64 LevelGeneration = 7;
    int64 BindingGeneration = 8;
    int64 CommandId = 9;
    int32 Action = 10;
    int32 SourceId = 11;
    int64 ExpectedRequestId = 12;
    int64 ExpectedRevision = 13;
}
message SupplyRequestResponse // IResponse
{
    int32 RpcId = 1;
    int32 Error = 2;
    string Message = 3;
    int64 CommandId = 4;
    int32 Status = 5;
}

// ResponseType SupplyRequestSubmitResponse
message SupplyRequestSubmitRequest // IRequest
{
    int32 RpcId = 1;
    int64 PeerId = 2;
    int64 PeerInstanceId = 3;
    int64 PeerGeneration = 4;
    int32 ProtocolVersion = 5;
    string MatchId = 6;
    string WorldId = 7;
    int64 WorldGeneration = 8;
    int64 LevelId = 9;
    int64 LevelGeneration = 10;
    int64 BindingGeneration = 11;
    int64 CommandId = 12;
    int32 Action = 13;
    int32 SourceId = 14;
    int64 ExpectedRequestId = 15;
    int64 ExpectedRevision = 16;
}
message SupplyRequestSubmitResponse // IResponse
{
    int32 RpcId = 1;
    int32 Error = 2;
    string Message = 3;
    int64 CommandId = 4;
    int32 Status = 5;
}

message GridSupplyRequestState
{
    int32 MemberId = 1;
    int64 BindingGeneration = 2;
    int64 RequestId = 3;
    int64 Revision = 4;
    int32 SourceId = 5;
    int32 State = 6;
    int64 ShipmentId = 7;
}
