syntax = "proto3";
package ET;

// ResponseType GridCommandResponse
message GridCommandRequest // IRequest
{
    int32 RpcId = 1;
    int32 ProtocolVersion = 2;
    string MatchId = 3;
    string WorldId = 4;
    int64 WorldGeneration = 5;
    int64 BindingGeneration = 6;
    int64 CommandId = 7;
    int32 Action = 8;
    int32 X = 9;
    int32 Y = 10;
    int64 TargetId = 11;
    int64 ExpectedItemId = 12;
    int64 ExpectedTargetItemId = 13;
    int64 ExpectedProcessId = 14;
    int64 LevelId = 15;
    int64 LevelGeneration = 16;
    repeated int64 ExpectedContentIds = 17;
    int32 ExpectedRemainingPortions = 18;
    int64 ExpectedLayoutVersion = 19;
    int64 ExpectedOrderId = 20;
}

message GridCommandResponse // IResponse
{
    int32 RpcId = 1;
    int32 Error = 2;
    string Message = 3;
    int64 CommandId = 4;
    int32 Status = 5;
}

// 内部可信转交，不进入 wire 白名单。
// ResponseType GridSubmitResponse
message GridSubmitRequest // IRequest
{
    int32 RpcId = 1;
    int64 PeerId = 2;
    int64 PeerInstanceId = 3;
    int64 PeerGeneration = 4;
    int32 ProtocolVersion = 5;
    string MatchId = 6;
    string WorldId = 7;
    int64 WorldGeneration = 8;
    int64 BindingGeneration = 9;
    int64 CommandId = 10;
    int32 Action = 11;
    int32 X = 12;
    int32 Y = 13;
    int64 TargetId = 14;
    int64 ExpectedItemId = 15;
    int64 ExpectedTargetItemId = 16;
    int64 ExpectedProcessId = 17;
    int64 LevelId = 18;
    int64 LevelGeneration = 19;
    repeated int64 ExpectedContentIds = 20;
    int32 ExpectedRemainingPortions = 21;
    int64 ExpectedLayoutVersion = 22;
    int64 ExpectedOrderId = 23;
}

message GridSubmitResponse // IResponse
{
    int32 RpcId = 1;
    int32 Error = 2;
    string Message = 3;
    int64 CommandId = 4;
    int32 Status = 5;
}

message GridPathCell
{
    int32 X = 1;
    int32 Y = 2;
}

message GridActorState
{
    int32 MemberId = 1;
    int64 Generation = 2;
    int32 X = 3;
    int32 Y = 4;
    int32 NextX = 5;
    int32 NextY = 6;
    int64 StepStartTick = 7;
    int32 Motion = 8;
    int32 Facing = 9;
    int64 HandItemId = 10;
    int32 GoalX = 11;
    int32 GoalY = 12;
    repeated GridPathCell Path = 13;
    int64 LastCommandId = 14;
    int32 LastStatus = 15;
    string LastReason = 16;
    int64 WorkId = 17;
    int64 FrontWorkId = 18;
    int64 FrontClaimSerial = 19;
}

message GridStationState
{
    int64 StationId = 1;
    int32 X = 2;
    int32 Y = 3;
    string Name = 4;
    int64 ItemId = 5;
    int32 Kind = 6;
    int64 AutoProcessId = 7;
    int32 DefinitionId = 8;
    int32 Orientation = 9;
    int32 Capabilities = 10;
    int32 ItemSlotCapacity = 11;
    repeated GridPathCell Footprint = 12;
    repeated GridPathCell Approaches = 13;
    int64 BakeProcessId = 14;
    repeated int64 PoolItemIds = 15;
    int32 WaterDefinitionId = 16;
    int32 WaterUnits = 17;
    int32 UpgradeDefinitionId = 18;
    int32 UpgradeLevel = 19;
}

message GridItemState
{
    int64 ItemId = 1;
    string Name = 2;
    int32 Location = 3;
    int64 HolderId = 4;
    int32 X = 5;
    int32 Y = 6;
    repeated int64 Contents = 7;
    int32 DefinitionId = 8;
    int64 AutoProcessId = 9;
    int64 BakeProcessId = 10;
    int32 Hygiene = 11;
    int32 Form = 12;
    bool Discardable = 13;
    int64 BoundOrderId = 14;
}

message GridWorldSnapshot // IMessage
{
    string MatchId = 1;
    string WorldId = 2;
    int64 WorldGeneration = 3;
    int64 BindingGeneration = 4;
    int32 MemberId = 5;
    int64 Version = 6;
    int64 Tick = 7;
    int32 Width = 8;
    int32 Height = 9;
    int32 KitchenBottom = 10;
    int32 TickMilliseconds = 11;
    int32 StepTicks = 12;
    repeated GridActorState Actors = 13;
    repeated GridStationState Stations = 14;
    repeated GridItemState Items = 15;
    repeated GridManualProcessState Processes = 16;
    int64 LevelId = 17;
    int64 LevelGeneration = 18;
    repeated GridAutoProcessState AutoProcesses = 19;
    int32 LevelPhase = 20;
    bool LevelPaused = 21;
    int32 LevelOperatingTicks = 22;
    int32 LevelElapsedTicks = 23;
    int32 LevelScore = 24;
    int32 LevelStars = 25;
    int32 LevelConfigId = 26;
    int32 NextLevelConfigId = 27;
    int64 LastCommandId = 28;
    int32 LastCommandKind = 29;
    int32 LastCommandStatus = 30;
    string LastCommandReason = 31;
    int64 LayoutVersion = 32;
    repeated GridBakeProcessState BakeProcesses = 33;
    repeated int32 AllowedDishIds = 34;
    repeated GridCompanionState Companions = 35;
    repeated GridFrontWorkState FrontWorks = 36;
    repeated GridCustomerState Customers = 37;
    repeated GridOrderState Orders = 38;
    repeated GridTableState Tables = 39;
    repeated int64 WaitingCustomers = 40;
    int32 SkippedArrivals = 41;
    int32 BuffSeed = 42;
    int64 BuffDrawVersion = 43;
    repeated int32 BuffCandidates = 44;
    int32 SelectedBuffId = 45;
    bool RequireBuffChoice = 46;
    repeated GridSupplySourceState SupplySources = 47;
    repeated GridSupplyShipmentState SupplyShipments = 48;
    repeated int32 RenovationCandidates = 49;
    int32 SelectedRenovationId = 50;
    int64 RenovationChoiceVersion = 51;
    int64 RenovationLevelId = 52;
    int64 RenovationLevelGeneration = 53;
    repeated GridRenovationAppliedState RenovationApplied = 54;
    bool SaveEnabled = 55;
    string SaveResultId = 56;
    int32 SaveState = 57;
    string SaveFailure = 58;
    string LastSavedSlotId = 59;
    bool CanControlRestaurant = 60;
    int32 ServedOrders = 61;
    int32 UnfulfilledOrders = 62;
    int64 SelectedUpgradeStationId = 63;
    int32 PendingUpgradeExpectedLevel = 64;
    repeated GridRenovationUpgradeTarget UpgradeTargets = 65;
}

message GridCommandResult // IMessage
{
    string MatchId = 1;
    string WorldId = 2;
    int64 WorldGeneration = 3;
    int64 BindingGeneration = 4;
    int64 CommandId = 5;
    int32 Status = 6;
    string Reason = 7;
    int64 Version = 8;
    int64 LevelId = 9;
    int64 LevelGeneration = 10;
}

message GridManualProcessState
{
    int64 ProcessId = 1;
    int32 RecipeId = 2;
    int64 InputItemId = 3;
    int64 TargetItemId = 4;
    int64 StationId = 5;
    int32 RequiredTicks = 6;
    int32 ProgressTicks = 7;
    int32 State = 8;
    int32 WorkerMemberId = 9;
    int64 WorkerGeneration = 10;
    int64 OutputItemId = 11;
}

message GridAutoProcessState
{
    int64 ProcessId = 1;
    int32 RecipeId = 2;
    int64 PotItemId = 3;
    int64 StartStationId = 4;
    int64 StartedTick = 5;
    int32 RequiredTicks = 6;
    int32 ProgressTicks = 7;
    int32 OutputDefinitionId = 8;
    int32 TotalPortions = 9;
    int32 RemainingPortions = 10;
    int32 ServingContainerDefinitionId = 11;
    int32 State = 12;
    repeated int64 InputItemIds = 13;
    int32 RequiredCapability = 14;
    bool LockContainer = 15;
}
