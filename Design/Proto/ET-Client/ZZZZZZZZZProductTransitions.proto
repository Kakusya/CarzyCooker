    string WorldId = 2;
    int64 WorldGeneration = 3;
    int64 LevelId = 4;
    int64 LevelGeneration = 5;
    int32 MemberId = 6;
    int64 BindingGeneration = 7;
    int64 Version = 8;
    int64 Tick = 9;
    int64 ShipmentId = 10;
    int64 ShipmentInstanceId = 11;
    int32 Stage = 12;
    int64 TransitionSerial = 13;
    int64 OutcomeSerial = 14;
}

