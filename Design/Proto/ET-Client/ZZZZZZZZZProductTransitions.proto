syntax = "proto3";
package ET;

// 内部转换／后继消息：只进入本轮 ProductHost 的 HostSession，不开放 Peer／wire。

message KitchenWorkTransition // IMessage
{
    int32 ProtocolVersion = 1;
    string MatchId = 2;
    string WorldId = 3;
    int64 WorldGeneration = 4;
    int64 LevelId = 5;
    int64 LevelGeneration = 6;
    int64 SourceId = 7;
    int64 SourceInstanceId = 8;
    int64 TransitionSerial = 9;
    int32 ProcessKind = 10;
    int32 Action = 11;
}

message CustomerFlowTransition // IMessage
{
    int32 ProtocolVersion = 1;
    string MatchId = 2;
    string WorldId = 3;
    int64 WorldGeneration = 4;
    int64 LevelId = 5;
    int64 LevelGeneration = 6;
    int64 SourceId = 7;
    int64 SourceInstanceId = 8;
    int64 TransitionSerial = 9;
    int32 Action = 10;
}

message CustomerFlowFinished // IMessage
{
    int32 ProtocolVersion = 1;
    string MatchId = 2;
    string WorldId = 3;
    int64 WorldGeneration = 4;
    int64 LevelId = 5;
    int64 LevelGeneration = 6;
    int64 SourceId = 7;
    int64 SourceInstanceId = 8;
    int64 TransitionSerial = 9;
    int32 Phase = 10;
    int64 TableStationId = 11;
}

