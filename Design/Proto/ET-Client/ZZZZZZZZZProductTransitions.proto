// 提交后的具名结果：每收件人独立 DTO，先同版快照后结果。内部转换不由客户端转交。

message ProductCommandOutcome // IMessage
{
    string MatchId = 1;
    string WorldId = 2;
    int64 WorldGeneration = 3;
    int64 LevelId = 4;
    int64 LevelGeneration = 5;
    int32 MemberId = 6;
    int64 BindingGeneration = 7;
    int64 Version = 8;
    int64 Tick = 9;
    int32 Kind = 10;
    int64 CommandId = 11;
    int32 Status = 12;
    string Reason = 13;
    int64 OutcomeSerial = 14;
    int64 OriginLevelId = 15;
    int64 OriginLevelGeneration = 16;
}

message KitchenWorkOutcome // IMessage
{
    string MatchId = 1;
    string WorldId = 2;
    int64 WorldGeneration = 3;
    int64 LevelId = 4;
    int64 LevelGeneration = 5;
    int32 MemberId = 6;
    int64 BindingGeneration = 7;
    int64 Version = 8;
    int64 Tick = 9;
    int32 ProcessKind = 10;
    int64 WorkId = 11;
    int64 WorkInstanceId = 12;
    int64 TransitionSerial = 13;
    int32 Stage = 14;
    int64 OutputItemId = 15;
    int64 OutcomeSerial = 16;
}

