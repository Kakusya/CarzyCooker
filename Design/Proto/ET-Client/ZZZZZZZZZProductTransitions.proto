{
    string MatchId = 1;
    string WorldId = 2;
    int64 WorldGeneration = 3;
    int64 LevelId = 4;
    int64 LevelGeneration = 5;
    int32 MemberId = 6;
    int64 BindingGeneration = 7;
    int64 Version = 8;
    int64 Tick = 9;
    int64 WorkId = 10;
    int64 WorkInstanceId = 11;
    int64 ClaimSerial = 12;
    int32 Kind = 13;
    int32 Stage = 14;
    int64 OutcomeSerial = 15;
}

