// 前厅完成通知的后继请求；源为当前 Customer 或已完成的 Clear 工作。
message FrontWorkCreateRequest // IMessage
{
    int32 ProtocolVersion = 1;
    string MatchId = 2;
    string WorldId = 3;
    int64 WorldGeneration = 4;
    int64 LevelId = 5;
    int64 LevelGeneration = 6;
    int64 SourceId = 7;
    int64 SourceInstanceId = 8;
    int64 TransitionSerial = 9;
    int32 Kind = 10;
}

// 结算提交后的内部完成通知，接收后才请求候选准备。
message LevelFinished // IMessage
{
    int32 ProtocolVersion = 1;
    string MatchId = 2;
    string WorldId = 3;
    int64 WorldGeneration = 4;
    int64 LevelId = 5;
    int64 LevelGeneration = 6;
    int64 SourceId = 7;
    int64 SourceInstanceId = 8;
    int64 TransitionSerial = 9;
}
