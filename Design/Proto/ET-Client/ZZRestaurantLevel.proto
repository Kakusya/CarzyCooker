syntax = "proto3";
package ET;

// 单机类型化控制，入口与内部提交都不开放 wire。
// ResponseType LevelCommandResponse
message LevelCommandRequest // IRequest
{
    int32 RpcId = 1;
    int32 ProtocolVersion = 2;
    string MatchId = 3;
    string WorldId = 4;
    int64 WorldGeneration = 5;
    int64 BindingGeneration = 6;
    int64 CommandId = 7;
    int64 LevelId = 8;
    int64 LevelGeneration = 9;
    int32 Action = 10;
    int32 NextLevelConfigId = 11;
}

message LevelCommandResponse // IResponse
{
    int32 RpcId = 1;
    int32 Error = 2;
    string Message = 3;
    int64 CommandId = 4;
    int32 Status = 5;
}

// ResponseType LevelSubmitResponse
message LevelSubmitRequest // IRequest
{
    int32 RpcId = 1;
    int64 PeerId = 2;
    int64 PeerInstanceId = 3;
    int64 PeerGeneration = 4;
    int32 ProtocolVersion = 5;
    string MatchId = 6;
    string WorldId = 7;
    int64 WorldGeneration = 8;
    int64 BindingGeneration = 9;
    int64 CommandId = 10;
    int64 LevelId = 11;
    int64 LevelGeneration = 12;
    int32 Action = 13;
    int32 NextLevelConfigId = 14;
}

message LevelSubmitResponse // IResponse
{
    int32 RpcId = 1;
    int32 Error = 2;
    string Message = 3;
    int64 CommandId = 4;
    int32 Status = 5;
}
