syntax = "proto3";
package ET;
// ResponseType ChooseBuffResponse
message ChooseBuffRequest // IRequest
{
    int32 RpcId = 1;
    int32 ProtocolVersion = 2;
    string MatchId = 3;
    string WorldId = 4;
    int64 WorldGeneration = 5;
    int64 BindingGeneration = 6;
    int64 LevelId = 7;
    int64 LevelGeneration = 8;
    int64 CommandId = 9;
    int64 DrawVersion = 10;
    int32 ChoiceDefId = 11;
}
message ChooseBuffResponse // IResponse
{
    int32 RpcId = 1;
    int32 Error = 2;
    string Message = 3;
    int64 CommandId = 4;
    int32 Status = 5;
}
// ResponseType ChooseBuffSubmitResponse
message ChooseBuffSubmitRequest // IRequest
{
    int32 RpcId = 1;
    int64 PeerId = 2;
    int64 PeerInstanceId = 3;
    int64 PeerGeneration = 4;
    int32 ProtocolVersion = 5;
    string MatchId = 6;
    string WorldId = 7;
    int64 WorldGeneration = 8;
    int64 BindingGeneration = 9;
    int64 LevelId = 10;
    int64 LevelGeneration = 11;
    int64 CommandId = 12;
    int64 DrawVersion = 13;
    int32 ChoiceDefId = 14;
}
message ChooseBuffSubmitResponse // IResponse
{
    int32 RpcId = 1;
    int32 Error = 2;
    string Message = 3;
    int64 CommandId = 4;
    int32 Status = 5;
}
